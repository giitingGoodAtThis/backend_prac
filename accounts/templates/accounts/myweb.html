<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENZON - Profile</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    overflow: auto;
    background-size: cover;
    background-color: gray;
}

/* MAIN */
.tunga {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}  /* ← FIXED */

#bot {
    background-color: rgb(11, 182, 239);
    margin-top: 100px;
    margin-bottom: 5px;
    font-weight: bold;
    font-size: 125px;
    border: none;
    cursor: pointer;
    font-style: italic;
    color: white;
}

.color {
    color: white;
    font-size: larger;
    font-weight: bold;
}

.pp {
    background-color: rgb(11, 182, 239);
    border-radius: 10px;
    color: white;
}

.LOGIN {
    background-color: gray;
    color: #b3ecf1;
    font-weight: bold;
    font-size: 30px;
    margin-left: 10px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}

/* POPUP */
.popup-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
}

.popup-content {
  position: relative;
  background: white;
  width: 300px;
  margin: 100px auto;
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 28px;
  cursor: pointer;
  color: #666;
}

/* NAVBAR */
.hayst {
    margin-left: 150px;
    margin-right: 150px;
    margin-top: 50px;
    padding: 1.5px;
    background-color: #13cee784;
    text-align: center;
} /* ← FIXED */

.buttonLink {
    background-color: gray;
    color: #b3ecf1;
    font-weight: bold;
    font-size: 30px;
    margin-left: 10px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}
</style>
</head>
<body>

<section class="hayst">
<h3>
    <a href=""><button class="buttonLink">About</button></a>
    <a href=""><button class="buttonLink">Services</button></a>
    <a href=""><button class="buttonLink">Contacts</button></a>
</h3>
</section>

<div class="tunga">

<button id="bot">Benz Retome</button>
<p class="color"><u>Web Developer</u></p>

<button id="openLogin" class="LOGIN">Login</button>

<!-- POPUP -->
<div id="loginPopup" class="popup-overlay">
  <div class="popup-content">
    <span class="close-btn">&times;</span>

    <!-- Login Form -->
    <div id="loginForm-container">
      <h3>Login</h3>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p>Don't have an account? <a href="#" id="switchToSignup">Sign Up</a></p>
    </div>

    <!-- Signup Form -->
    <div id="signupForm-container" style="display:none;">
      <h3>Sign Up</h3>
      <form id="signupForm">
        <input type="text" id="signup-username" placeholder="Username" required>
        <input type="email" id="signup-email" placeholder="Email" required>
        <input type="password" id="signup-password" placeholder="Password" required>
        <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
        <button type="submit">Sign Up</button>
      </form>
      <p>Already have an account? <a href="#" id="switchToLogin">Login</a></p>
    </div>

  </div>
</div>

</div> <!-- END MAIN -->

<script>
// ELEMENTS
const popup = document.getElementById('loginPopup');
const openBtn = document.getElementById('openLogin');
const closeBtn = document.querySelector('.close-btn');

const loginForm = document.getElementById('loginForm');
const signupForm = document.getElementById('signupForm');

const switchToSignup = document.getElementById('switchToSignup');
const switchToLogin = document.getElementById('switchToLogin');

const loginFormContainer = document.getElementById('loginForm-container');
const signupFormContainer = document.getElementById('signupForm-container');

// OPEN POPUP
openBtn.addEventListener('click', () => popup.style.display = 'block');

// CLOSE POPUP
closeBtn.addEventListener('click', () => popup.style.display = 'none');

// CLOSE BY CLICKING OUTSIDE
popup.addEventListener('click', e => {
  if (e.target === popup) popup.style.display = 'none';
});

// SWITCH FORMS
switchToSignup.addEventListener('click', e => {
  e.preventDefault();
  loginFormContainer.style.display='none';
  signupFormContainer.style.display='block';
});

switchToLogin.addEventListener('click', e => {
  e.preventDefault();
  signupFormContainer.style.display='none';
  loginFormContainer.style.display='block';
});

// POST helper
async function postJSON(url, data) {
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  return res.json();
}

// LOGIN
loginForm.addEventListener('submit', async e => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  try {
    const data = await postJSON('login/', {username,password});
    alert(data.message);

    if(data.status === 'success') {
        popup.style.display='none';
        window.location.href = "/accounts/dashboard/";  // REDIRECT
    }
  } catch(err){
    alert("Backend error: " + err);
  }
});

// SIGNUP
signupForm.addEventListener('submit', async e => {
  e.preventDefault();
  const username = document.getElementById('signup-username').value;
  const email = document.getElementById('signup-email').value;
  const password = document.getElementById('signup-password').value;
  const confirm_password = document.getElementById('signup-confirm-password').value;

  try {
    const data = await postJSON('/signup/', {
      username,email,password,confirm_password
    });

    alert(data.message);

    if(data.status === 'success') {
        popup.style.display='none';
        window.location.href = "/accounts/dashboard/";  // REDIRECT
    }
  } catch(err){
    alert("Backend error: " + err);
  }
});
</script>

</body>
</html>
