<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #0bb6ef, #13cee7);
    min-height: 100vh;
    color: #fff;
}

/* HEADER */
header {
    background: rgba(0,0,0,0.2);
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
header h1 {
    margin: 0;
    font-size: 2em;
}
.logout-btn {
    background-color: #f44336;
    border: none;
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.2s ease;
}
.logout-btn:hover {
    background-color: #d32f2f;
    transform: translateY(-2px);
}

/* CARDS */
.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 40px auto;
    max-width: 1200px;
    gap: 20px;
}

.card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    border-radius: 15px;
    padding: 30px 20px;
    width: 280px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
}
.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}

.card h2 {
    margin-top: 0;
    font-size: 1.5em;
    margin-bottom: 10px;
}

/* INFO BOX */
#infoBox {
    width: 80%;
    margin: 30px auto 0;
    padding: 25px 30px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    box-shadow: 0 12px 25px rgba(0,0,0,0.2);
    display: none;
    animation: fadeIn 0.3s ease;
    line-height: 1.6;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(8px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>
<body>

<header>
    <h1>Welcome, {{ user.username }}</h1>

    <!-- LOGOUT BUTTON -->
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="logout-btn">Logout</button>
    </form>
</header>

<div class="container">

    <div class="card" onclick="showInfo('profile')">
        <h2>Profile</h2>
        <p>Your account information</p>
    </div>

    <div class="card" onclick="showInfo('stats')">
        <h2>Stats</h2>
        <p>Your activity summary</p>
    </div>

    <div class="card" onclick="showInfo('settings')">
        <h2>Settings</h2>
        <p>Manage your preferences</p>
    </div>

</div>

<!-- DYNAMIC INFO BOX -->
<div id="infoBox"></div>

<script>
function showInfo(type) {
    const box = document.getElementById("infoBox");

    if (box.style.display === "block" && box.dataset.current === type) {
        box.style.display = "none";
        return;
    }

    if (type === "profile") {
        box.innerHTML = `
            <h2>Profile Information</h2>
            <p><strong>Username:</strong> {{ user.username }}</p>
            <p><strong>Email:</strong> {{ user.email }}</p>
            <p>You can update your profile settings soon.</p>
        `;
    }
    else if (type === "stats") {
        box.innerHTML = `
            <h2>Your Stats</h2>
            <p><strong>Projects Completed:</strong> 5</p>
            <p><strong>Tasks Pending:</strong> 2</p>
            <p>Your productivity is above average. Keep going!</p>
        `;
    }
    else if (type === "settings") {
        box.innerHTML = `
            <h2>Settings</h2>
            <p>Manage your preferences and account configurations.</p>
            <button style="
                padding:10px 20px;
                background:#0bb6ef;
                border:none;
                border-radius:10px;
                cursor:pointer;
                color:white;
                font-weight:bold;
            ">
                Edit Profile (coming soon)
            </button>
        `;
    }

    box.dataset.current = type;
    box.style.display = "block";
}
</script>

</body>
</html>
